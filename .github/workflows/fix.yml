name: fix
# Dispatched by the tripwire Worker (ci.js) when a repo's default branch goes red, or by hand with
# no run_id to work a GitHub issue. A model works in a throwaway checkout and this job opens the PR.
# If it isn't a code problem, it explains on the issue. The GitHub token never reaches the model step.
on:
  workflow_dispatch:
    inputs:
      repo: { description: owner/name of the red repo, required: true }
      run_id: { description: id of the failing run; leave empty to fix the issue itself, required: false }
      issue: { description: tripwire issue number in that repo, required: true }
      files: { description: optional space-separated paths to hand the model in issue mode, required: false }

concurrency: tripwire-fix-${{ inputs.repo }}
permissions: {}

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      REPO: ${{ inputs.repo }}
      RUN_ID: ${{ inputs.run_id }}
      ISSUE: ${{ inputs.issue }}
      FILES: ${{ inputs.files }}
    steps:
      - name: Check inputs
        run: '[[ "$REPO" =~ ^nulljosh/[A-Za-z0-9._-]+$ && "$RUN_ID" =~ ^[0-9]*$ && "$ISSUE" =~ ^[0-9]+$ ]] || { echo "bad inputs"; exit 1; }'

      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repo }}
          token: ${{ secrets.TRIPWIRE_GH_TOKEN }}
          persist-credentials: false

      # gh run view --log-failed often comes back empty (it matches jobs by name inside the log zip),
      # which left Claude with nothing to read. Pull each failed job's log from the API instead.
      - name: Fetch the failing log
        id: triage
        env:
          GH_TOKEN: ${{ secrets.TRIPWIRE_GH_TOKEN }}
        run: |
          git rev-parse HEAD > "$RUNNER_TEMP/base"
          log="$RUNNER_TEMP/failed.log"; : > "$log"
          if [ -z "$RUN_ID" ]; then  # issue mode: the issue text is the brief
            gh issue view "$ISSUE" -R "$REPO" --json title,body -q '"# " + .title + "\n\n" + .body' > "$log"
            [ -z "$FILES" ] || printf '\nFiles: %s\n' "$FILES" >> "$log"  # named files score highest in pick.py
            echo "skip=" >> "$GITHUB_OUTPUT"; exit 0
          fi
          jobs=$(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs" --jq '.jobs[] | select(.conclusion=="failure" or .conclusion=="timed_out") | "\(.id)\t\(.labels | join(","))\t\(.name)"')
          while IFS=$'\t' read -r id labels name; do
            [ -n "$id" ] || continue
            echo "===== job: $name (runs-on: $labels)" >> "$log"
            # a job that dies mid-step never uploads its log; the API then returns a 404 body, not a log
            if body=$(gh api "repos/$REPO/actions/jobs/$id/logs" 2>/dev/null); then tail -n 300 <<< "$body" >> "$log"
            else gh run view "$RUN_ID" -R "$REPO" --log 2>/dev/null | grep -F "$name"$'\t' | tail -n 300 >> "$log" || true; fi
          done <<< "$jobs"

          # ponytail: regex triage, not a model call. Add signatures as new non-code failures show up.
          skip=""
          if [ "$(grep -vc '^=====' "$log")" -eq 0 ]; then
            skip="the failing run's log could not be read, so there was nothing to fix from"
          elif [ -n "$jobs" ] && ! cut -f2 <<< "$jobs" | grep -qv 'macos'; then
            skip="every failed job runs on macOS (Xcode or simulator), which this Ubuntu fixer cannot reproduce"
          elif grep -qiE "HttpError: Not Found|rate limit|ETIMEDOUT|ECONNRESET|Could not resolve host|50[234] (Bad Gateway|Service Unavailable|Gateway Time)|Authentication error|Unable to download|curl: \((6|7|28)\)|secret .*(not set|missing)|Input required and not supplied" "$log"; then
            skip="the log points at infrastructure (an outage, rate limit, download or missing secret), not code: $(grep -m1 -oiE "HttpError: Not Found|rate limit[^.]*|ETIMEDOUT|ECONNRESET|Could not resolve host[^ ]*|50[234] [A-Za-z ]+|Authentication error|Unable to download[^.]*|curl: \([0-9]+\)[^.]*|secret .*(not set|missing)|Input required and not supplied[^.]*" "$log" | head -c 160)"
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
          echo "lines=$(wc -l < "$log") skip=${skip:-no}"

      - name: Skip without spending a model run
        if: steps.triage.outputs.skip != ''
        env:
          GH_TOKEN: ${{ secrets.TRIPWIRE_GH_TOKEN }}
          WHY: ${{ steps.triage.outputs.skip }}
        run: |
          gh issue comment "$ISSUE" -R "$REPO" --body "tripwire skipped the fix: $WHY. A person needs to look at this one."

      - name: Write the prompt
        if: steps.triage.outputs.skip == ''
        run: |
          [ -z "$RUN_ID" ] && cat > "$RUNNER_TEMP/prompt.md" <<EOF
          Fix GitHub issue #$ISSUE in $REPO. You are in a fresh checkout of it. The issue's title
          and text are at $RUNNER_TEMP/failed.log. Find the code it is about and make the smallest
          correct change that resolves it, matching the style around it. Do not commit or push,
          and do not touch unrelated files. If the issue needs a person (an account, a store
          listing, a design call, hardware), change nothing and say why.

          End with a short plain-English summary for the PR: what was wrong, what you changed,
          and how someone can check it.
          EOF
          [ -n "$RUN_ID" ] && cat > "$RUNNER_TEMP/prompt.md" <<EOF || true
          CI is red on the default branch of $REPO. You are in a fresh checkout of it.
          The failing job's log (last 400 lines) is at $RUNNER_TEMP/failed.log. The workflows
          are in .github/workflows (in a monorepo, find the one whose name matches the log).

          1. Find the root cause. Read the code the log points at, not just the last error line.
          2. Reproduce the failing step locally if this Ubuntu runner has the toolchain.
          3. Make the smallest correct fix, then re-run the failing step until it passes.
          Never skip, weaken or delete tests or checks to make them pass. Never edit CI config
          to hide a failure. Do not commit, do not push, and leave no stray files behind.
          If it is not a code problem (outage, expired secret, rate limit, flaky network,
          runner image, macOS-only build you cannot run), change nothing.

          End with a short plain-English summary for the PR: what broke and why, what you
          changed, and how you verified it (or exactly why you could not).
          EOF

      # aider writes the fix. Kimi (MOONSHOT_API_KEY, paid, close to Opus on coding) when its key works,
      # otherwise free Gemma (GEMINI_API_KEY, Google AI Studio).
      # Review happens by hand: Joshua's Claude sessions read the PR before it merges.
      - uses: actions/setup-python@v5
        if: steps.triage.outputs.skip == ''
        with:
          python-version: '3.12'

      - name: Kimi or Gemma fixes it
        if: steps.triage.outputs.skip == ''
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
        run: |
          pip install -q aider-chat
          # ponytail: aider gets one turn, so pick its files up front. Score source files by how many of the
          # brief's identifiers (backticked words, CamelCase, filenames, longer title words) they contain;
          # a definition ("struct Foo") counts triple. Top 10, lock files and anything over 60KB left out.
          cat > "$RUNNER_TEMP/pick.py" <<'PY'
          import re, subprocess, sys
          text = open(sys.argv[1], errors="ignore").read()
          ids = set(re.findall(r"`([^`\n]{2,60})`", text))
          ids = {w for i in ids for w in re.split(r"[^A-Za-z0-9_]+", i) if len(w) > 2}
          ids |= set(re.findall(r"\b[A-Z][a-z]+[A-Z][A-Za-z0-9]+\b", text))
          names = set(re.findall(r"[\w./-]+\.(?:js|mjs|ts|tsx|jsx|py|go|rs|swift|kt|java|rb|json|toml|ya?ml|sh|css|html)\b", text))
          title = text.splitlines()[0] if text.startswith("# ") else ""
          words = {w.lower() for w in re.findall(r"[A-Za-z]{5,}", title)} - {"needs", "should", "would", "there", "their", "which", "about"}
          files = [f for f in subprocess.run(["git", "ls-files"], capture_output=True, text=True).stdout.split("\n")
                   if re.search(r"\.(js|mjs|ts|tsx|jsx|py|go|rs|swift|kt|java|rb|css|html)$", f)
                   and not re.search(r"(^|/)(node_modules|vendor|dist|build)/|\.min\.", f)]
          scored = []
          for f in files:
              try:
                  src = open(f, errors="ignore").read()
              except OSError:
                  continue
              if len(src) > 60000:
                  continue
              n = 5 * any(f.endswith(x.lstrip("./")) for x in names)
              n += sum(3 if re.search(r"\b(struct|class|enum|func|function|def|interface|type|extension|const)\s+" + re.escape(i) + r"\b", src) else 1
                       for i in ids if i in src)
              n += sum(1 for w in words if w in src.lower())
              if n:
                  scored.append((n, f))
          print("\n".join(f for _, f in sorted(scored, reverse=True)[:10]))
          PY
          files=$(python3 "$RUNNER_TEMP/pick.py" "$RUNNER_TEMP/failed.log")
          echo "files: $(echo $files)"
          # Both vendors rename models; ask each which ones this key can call. Kimi first: newest k-series.
          model=""
          kimi() { curl -sf "https://api.moonshot.ai/v1/$1" -H "Authorization: Bearer $MOONSHOT_API_KEY"; }
          # only with money on the account; otherwise every call fails and there's no fallback
          if [ -n "$MOONSHOT_API_KEY" ] && [ "$(kimi users/me/balance | jq -r '.data.available_balance // 0 | . > 0' || echo false)" = true ]; then
            echo "kimi balance before: $(kimi users/me/balance | jq -r .data.available_balance)"
            echo "kimi models: $(kimi models | jq -r '[.data[].id] | join(" ")')"
            # newest pro model, never highspeed: highspeed was about 10x the price per fix (2026-10-30)
            model=$(kimi models | jq -r '[.data[].id | select(test("^kimi-k[0-9]")) | select(test("highspeed|turbo|vision|preview"; "i") | not)] | sort
              | ((map(select(test("pro"))) | last) // last // empty) | "moonshot/" + .' || true)
          fi
          [ -n "$model" ] || model=$(curl -sf "https://generativelanguage.googleapis.com/v1beta/models?pageSize=1000&key=$GEMINI_API_KEY" \
            | jq -r '[.models[] | select(.name | test("gemma")) | select(.supportedGenerationMethods | index("generateContent"))
                | .name | sub("models/"; "gemini/")] | sort_by(capture("(?<b>[0-9]+)b") .b | tonumber? // 0) | last // empty' || true)
          echo "model=${model:-none}"
          [ -n "$model" ] || { echo "No Kimi or Gemma model available to these keys." > "$RUNNER_TEMP/summary.md"; exit 0; }
          # Kimi rejects any temperature but its own default, so don't send one
          printf -- '- name: %s\n  use_temperature: false\n' "$model" > "$RUNNER_TEMP/models.yml"
          run_aider() {
            aider --model "$model" --model-settings-file "$RUNNER_TEMP/models.yml" --map-tokens 1024 --yes-always --no-auto-commits --no-dirty-commits \
              --no-check-update --no-show-model-warnings --no-pretty --no-stream --no-gitignore \
              --read "$RUNNER_TEMP/failed.log" --message-file "$1" $2 >> "$RUNNER_TEMP/aider.log" 2>&1 || true
          }
          run_aider "$RUNNER_TEMP/prompt.md" "$files"
          # Second turn: if it asked for code instead of editing, hand over what it named and go again.
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard | grep -v '^\.aider')" ]; then
            more=$(python3 "$RUNNER_TEMP/pick.py" "$RUNNER_TEMP/aider.log")
            files2=$(printf '%s\n%s\n' "$files" "$more" | grep . | sort -u | head -14)
            if [ "$files2" != "$(printf '%s\n' "$files" | grep . | sort -u)" ]; then
              echo "second pass files: $(echo $files2)"
              { echo "The files you asked for are now in the chat. Make the change now, don't ask again."; echo; cat "$RUNNER_TEMP/prompt.md"; } > "$RUNNER_TEMP/prompt2.md"
              run_aider "$RUNNER_TEMP/prompt2.md" "$files2"
            fi
          fi
          case $model in moonshot/*) echo "kimi balance after: $(kimi users/me/balance | jq -r .data.available_balance)";; esac
          rm -rf .aider*  # aider's chat history and tag cache, never part of the fix
          { echo "Fixed by ${model#*/} via aider."; echo; tail -n 40 "$RUNNER_TEMP/aider.log"; } > "$RUNNER_TEMP/summary.md"
          cat "$RUNNER_TEMP/aider.log"

      - name: Open the PR, or explain on the issue
        id: pr
        if: steps.triage.outputs.skip == ''
        env:
          GH_TOKEN: ${{ secrets.TRIPWIRE_GH_TOKEN }}
        run: |
          git config user.name tripwire
          git config user.email tripwire@users.noreply.github.com
          git add -A
          git diff --cached --quiet && git diff --quiet "$(cat "$RUNNER_TEMP/base")" HEAD && {
            { echo "tripwire looked at this and changed nothing:"; echo; cat "$RUNNER_TEMP/summary.md"; } > "$RUNNER_TEMP/comment.md"
            gh issue comment "$ISSUE" -R "$REPO" --body-file "$RUNNER_TEMP/comment.md"
            exit 0
          }
          what=${RUN_ID:+CI failure from run $RUN_ID}; what=${what:-issue #$ISSUE}
          git diff --cached --quiet || git commit -q -m "tripwire: fix $what"
          branch="tripwire/${RUN_ID:+ci-fix-$RUN_ID}"; [ -n "$RUN_ID" ] || branch="tripwire/issue-$ISSUE"
          git push -q "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "HEAD:refs/heads/$branch"
          title=$(gh issue view "$ISSUE" -R "$REPO" --json title -q .title | sed 's/CI failing/fix/')
          [ -n "$RUN_ID" ] || title="Fix: $title"
          { cat "$RUNNER_TEMP/summary.md"; echo; echo "Fixes #$ISSUE"; } > "$RUNNER_TEMP/body.md"
          url=$(gh pr create -R "$REPO" --head "$branch" --title "$title" --body-file "$RUNNER_TEMP/body.md")
          echo "$url"; echo "url=$url" >> "$GITHUB_OUTPUT"
