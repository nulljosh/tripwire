name: fix
# Dispatched by the tripwire Worker (ci.js) when a repo's default branch goes red.
# Claude Code works in a throwaway checkout: reproduce the failing step, fix the root cause,
# re-run it, then this job opens the PR. If it isn't a code problem, it explains on the issue.
# The GitHub token never reaches the Claude step; only checkout, log fetch and push see it.
on:
  workflow_dispatch:
    inputs:
      repo: { description: owner/name of the red repo, required: true }
      run_id: { description: id of the failing run, required: true }
      issue: { description: tripwire issue number in that repo, required: true }

concurrency: tripwire-fix-${{ inputs.repo }}
permissions: {}

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      REPO: ${{ inputs.repo }}
      RUN_ID: ${{ inputs.run_id }}
      ISSUE: ${{ inputs.issue }}
      HAS_CLAUDE: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - name: Check inputs
        run: '[[ "$REPO" =~ ^nulljosh/[A-Za-z0-9._-]+$ && "$RUN_ID" =~ ^[0-9]+$ && "$ISSUE" =~ ^[0-9]+$ ]] || { echo "bad inputs"; exit 1; }'

      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repo }}
          token: ${{ secrets.TRIPWIRE_GH_TOKEN }}
          persist-credentials: false

      # gh run view --log-failed often comes back empty (it matches jobs by name inside the log zip),
      # which left Claude with nothing to read. Pull each failed job's log from the API instead.
      - name: Fetch the failing log
        id: triage
        env:
          GH_TOKEN: ${{ secrets.TRIPWIRE_GH_TOKEN }}
        run: |
          git rev-parse HEAD > "$RUNNER_TEMP/base"
          log="$RUNNER_TEMP/failed.log"; : > "$log"
          jobs=$(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs" --jq '.jobs[] | select(.conclusion=="failure" or .conclusion=="timed_out") | "\(.id)\t\(.labels | join(","))\t\(.name)"')
          while IFS=$'\t' read -r id labels name; do
            [ -n "$id" ] || continue
            echo "===== job: $name (runs-on: $labels)" >> "$log"
            # a job that dies mid-step never uploads its log; the API then returns a 404 body, not a log
            if body=$(gh api "repos/$REPO/actions/jobs/$id/logs" 2>/dev/null); then tail -n 300 <<< "$body" >> "$log"
            else gh run view "$RUN_ID" -R "$REPO" --log 2>/dev/null | grep -F "$name"$'\t' | tail -n 300 >> "$log" || true; fi
          done <<< "$jobs"

          # ponytail: regex triage, not a model call. Add signatures as new non-code failures show up.
          skip=""
          if [ "$(grep -vc '^=====' "$log")" -eq 0 ]; then
            skip="the failing run's log could not be read, so there was nothing to fix from"
          elif [ -n "$jobs" ] && ! cut -f2 <<< "$jobs" | grep -qv 'macos'; then
            skip="every failed job runs on macOS (Xcode or simulator), which this Ubuntu fixer cannot reproduce"
          elif grep -qiE "HttpError: Not Found|rate limit|ETIMEDOUT|ECONNRESET|Could not resolve host|50[234] (Bad Gateway|Service Unavailable|Gateway Time)|Authentication error|Unable to download|curl: \((6|7|28)\)|secret .*(not set|missing)|Input required and not supplied" "$log"; then
            skip="the log points at infrastructure (an outage, rate limit, download or missing secret), not code: $(grep -m1 -oiE "HttpError: Not Found|rate limit[^.]*|ETIMEDOUT|ECONNRESET|Could not resolve host[^ ]*|50[234] [A-Za-z ]+|Authentication error|Unable to download[^.]*|curl: \([0-9]+\)[^.]*|secret .*(not set|missing)|Input required and not supplied[^.]*" "$log" | head -c 160)"
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
          echo "lines=$(wc -l < "$log") skip=${skip:-no}"

      - name: Skip without spending a model run
        if: steps.triage.outputs.skip != ''
        env:
          GH_TOKEN: ${{ secrets.TRIPWIRE_GH_TOKEN }}
          WHY: ${{ steps.triage.outputs.skip }}
        run: |
          gh issue comment "$ISSUE" -R "$REPO" --body "tripwire skipped the fix: $WHY. A person needs to look at this one."

      - name: Write the prompt
        if: steps.triage.outputs.skip == ''
        run: |
          cat > "$RUNNER_TEMP/prompt.md" <<EOF
          CI is red on the default branch of $REPO. You are in a fresh checkout of it.
          The failing job's log (last 400 lines) is at $RUNNER_TEMP/failed.log. The workflows
          are in .github/workflows (in a monorepo, find the one whose name matches the log).

          1. Find the root cause. Read the code the log points at, not just the last error line.
          2. Reproduce the failing step locally if this Ubuntu runner has the toolchain.
          3. Make the smallest correct fix, then re-run the failing step until it passes.
          Never skip, weaken or delete tests or checks to make them pass. Never edit CI config
          to hide a failure. Do not commit, do not push, and leave no stray files behind.
          If it is not a code problem (outage, expired secret, rate limit, flaky network,
          runner image, macOS-only build you cannot run), change nothing.

          End with a short plain-English summary for the PR: what broke and why, what you
          changed, and how you verified it (or exactly why you could not).
          EOF

      # Gemma 3 27B writes the fix (free, Google AI Studio key in GEMINI_API_KEY), driven by aider.
      # Claude reviews the PR afterwards whenever the CLAUDE_CODE_OAUTH_TOKEN secret is set.
      - uses: actions/setup-python@v5
        if: steps.triage.outputs.skip == ''
        with:
          python-version: '3.12'

      - name: Gemma fixes it
        if: steps.triage.outputs.skip == ''
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          pip install -q aider-chat
          # ponytail: hand aider the files the log names; it can't explore the repo like an agent can
          files=$(grep -oE '[A-Za-z0-9_./-]+\.(js|mjs|cjs|ts|tsx|jsx|py|go|rs|rb|java|kt|swift|json|toml|yml|yaml|sh|css|html)' "$RUNNER_TEMP/failed.log" \
            | sed 's#^\./##' | sort -u | while read -r f; do [ -f "$f" ] && echo "$f"; done | head -8)
          aider --model gemini/gemma-3-27b-it --yes-always --no-auto-commits --no-dirty-commits \
            --no-check-update --no-show-model-warnings --no-pretty --no-stream --no-gitignore \
            --read "$RUNNER_TEMP/failed.log" --message-file "$RUNNER_TEMP/prompt.md" $files \
            > "$RUNNER_TEMP/aider.log" 2>&1 || true
          rm -rf .aider*  # aider's chat history and tag cache, never part of the fix
          { echo "Fixed by Gemma 3 27B via aider."; echo; tail -n 40 "$RUNNER_TEMP/aider.log"; } > "$RUNNER_TEMP/summary.md"
          cat "$RUNNER_TEMP/aider.log"

      - name: Open the PR, or explain on the issue
        id: pr
        if: steps.triage.outputs.skip == ''
        env:
          GH_TOKEN: ${{ secrets.TRIPWIRE_GH_TOKEN }}
        run: |
          git config user.name tripwire
          git config user.email tripwire@users.noreply.github.com
          git add -A
          git diff --cached --quiet && git diff --quiet "$(cat "$RUNNER_TEMP/base")" HEAD && {
            { echo "tripwire looked at this and changed nothing:"; echo; cat "$RUNNER_TEMP/summary.md"; } > "$RUNNER_TEMP/comment.md"
            gh issue comment "$ISSUE" -R "$REPO" --body-file "$RUNNER_TEMP/comment.md"
            exit 0
          }
          git diff --cached --quiet || git commit -q -m "tripwire: fix CI failure from run $RUN_ID"
          branch="tripwire/ci-fix-$RUN_ID"
          git push -q "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "HEAD:refs/heads/$branch"
          title=$(gh issue view "$ISSUE" -R "$REPO" --json title -q .title | sed 's/CI failing/fix/')
          { cat "$RUNNER_TEMP/summary.md"; echo; echo "Fixes #$ISSUE"; } > "$RUNNER_TEMP/body.md"
          url=$(gh pr create -R "$REPO" --head "$branch" --title "$title" --body-file "$RUNNER_TEMP/body.md")
          echo "$url"; echo "url=$url" >> "$GITHUB_OUTPUT"
          git diff "$(cat "$RUNNER_TEMP/base")" HEAD > "$RUNNER_TEMP/fix.diff"

      - uses: actions/setup-node@v4
        if: steps.pr.outputs.url != '' && env.HAS_CLAUDE == 'true'
        with:
          node-version: 22

      # Read only: Claude sees the log and Gemma's diff, never pushes, and posts one review comment.
      - name: Claude reviews Gemma's fix
        if: steps.pr.outputs.url != '' && env.HAS_CLAUDE == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ secrets.TRIPWIRE_GH_TOKEN }}
          PR: ${{ steps.pr.outputs.url }}
        run: |
          npx -y @anthropic-ai/claude-code@2.1.288 -p "Review this CI fix written by a smaller model. The failing log is at $RUNNER_TEMP/failed.log and the diff at $RUNNER_TEMP/fix.diff; read the touched files in this checkout as needed. Answer in under 150 words of plain English: does it fix the root cause, is anything wrong or risky, and end with one line, either APPROVE or CHANGES NEEDED with the reason. Do not edit any file." \
            --model claude-sonnet-5-5 --max-turns 15 --allowedTools Read Grep Glob > "$RUNNER_TEMP/review.md" || exit 0
          { echo "Claude's review of this fix:"; echo; cat "$RUNNER_TEMP/review.md"; } > "$RUNNER_TEMP/review-body.md"
          gh pr comment "$PR" --body-file "$RUNNER_TEMP/review-body.md"
